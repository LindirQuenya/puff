[package]
name = "enerdhil"
version = "0.1.0"
edition = "2021"

[dependencies]
num = "0.4.3"
thiserror = "1.0.61"
serde = { version = "1.0", optional = true, features = ["derive"] }
petgraph = "0.6.5"
rand = "0.8.5"
bimap = "0.6.3"
graph-cycles = "0.1.0"
itertools = "0.13.0"
ordered-float = "4.2.2"
rayon = "1.10.0"
interp = "2.0.0"

[dev-dependencies]
serde_json = "1.0.117"
num = { version = "0.4.3", features = ["serde"] }
ordered-float = { version = "4.2.2", features = ["serde"] }

[features]
serde = ["dep:serde"]
